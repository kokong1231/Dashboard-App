name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - jin
      - 'claude/**'
    paths-ignore:
      - '**.md'

jobs:
  apk:
    name: assembleRelease
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 네이티브 모듈(reanimated / worklets / gesture-handler 등)이 C++ 를 컴파일하므로
      # android/build.gradle 에 고정된 NDK 버전이 필요하다.
      - name: Install NDK 27.1.12297006
        run: sdkmanager --install "ndk;27.1.12297006"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # react-native-dotenv 가 allowUndefined:false 로 설정되어 있어 .env.jin 이 없으면 번들링이 실패한다.
      # 시크릿이 등록돼 있으면 실제 키를, 없으면 자리표시자를 쓴다(이 경우 Claude 사용량 위젯만 동작하지 않음).
      - name: Write .env.jin
        env:
          CLAUDE_NOTION_API_KEY: ${{ secrets.CLAUDE_NOTION_API_KEY }}
          # 시크릿이 없을 때 쓰는 자리표시자 — 유효한 키가 아니다
          FALLBACK_KEY: ntn_missing_secret_placeholder
        run: |
          KEY="${CLAUDE_NOTION_API_KEY:-$FALLBACK_KEY}"
          if [ "$KEY" = "$FALLBACK_KEY" ]; then
            echo "::warning::CLAUDE_NOTION_API_KEY 시크릿이 없어 자리표시자로 빌드합니다. Claude 사용량 위젯은 동작하지 않습니다."
          fi
          printf 'CLAUDE_NOTION_API_KEY=%s\n' "$KEY" > .env.jin

      - name: Test shortcut widget
        run: yarn jest __tests__/ShortcutWidget.smoke.test.tsx

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jin-release-apk
          path: android/app/build/outputs/apk/release/jin.release.apk
          if-no-files-found: error
          retention-days: 30
